name: FontHub 4.1 General Compatibility Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fonthub-generalfix-v41/**'
      - '.github/workflows/fonthub-generalfix-v41.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Numbersf/MakeFontsGreatAgain.git upstream
          cat fonthub-generalfix-v41/parts/overlay.* | base64 -d > /tmp/overlay.zip
          echo 'e0d9dda944467304fe58ec75f0fa99dfb270558b8c753601e7b077f48ffda0ec  /tmp/overlay.zip' | sha256sum -c -
          unzip -t /tmp/overlay.zip
          unzip -qo /tmp/overlay.zip -d /tmp/overlay
          cp -a /tmp/overlay/app/. upstream/mfga-xposed/app/

          # Requested standalone package id; behavior remains based on upstream MFGA.
          grep -RIlZ 'com\.mfga\.xposed' upstream/mfga-xposed/app | xargs -0 -r sed -i 's/com\.mfga\.xposed/billionaire.xinye.xposed/g'

          # Exact FontHub 1.3 icon composition.
          base64 -d fonthub-generalfix-v41/icon192.b64 > /tmp/fonthub192.png
          for spec in 'mdpi 48' 'hdpi 72' 'xhdpi 96' 'xxhdpi 144' 'xxxhdpi 192'; do
            set -- $spec; d=$1; s=$2
            mkdir -p upstream/mfga-xposed/app/src/main/res/mipmap-$d
            convert /tmp/fonthub192.png -resize ${s}x${s} upstream/mfga-xposed/app/src/main/res/mipmap-$d/ic_launcher.png
            cp upstream/mfga-xposed/app/src/main/res/mipmap-$d/ic_launcher.png upstream/mfga-xposed/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

          ! grep -RIl 'com\.mfga\.xposed' upstream/mfga-xposed/app
          grep -n 'applicationId = "billionaire.xinye.xposed"' upstream/mfga-xposed/app/build.gradle.kts
          cat upstream/mfga-xposed/app/src/main/resources/META-INF/xposed/scope.list

      - name: Build release APK
        working-directory: upstream/mfga-xposed
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Align, sign and verify
        run: |
          set -euo pipefail
          UNSIGNED=$(find upstream/mfga-xposed/app/build/outputs/apk/release -name '*.apk' | head -1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$UNSIGNED" FontHub-4.1-aligned.apk
          curl -fsSL https://raw.githubusercontent.com/mfonville/pa_gapps/master/testkey.pk8 -o testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/mfonville/pa_gapps/master/testkey.x509.pem -o testkey.x509.pem
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --key testkey.pk8 --cert testkey.x509.pem \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out FontHub-XPosed-4.1-A16-GeneralCompatFix.apk FontHub-4.1-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs FontHub-XPosed-4.1-A16-GeneralCompatFix.apk
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging FontHub-XPosed-4.1-A16-GeneralCompatFix.apk | grep "package: name='billionaire.xinye.xposed'"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging FontHub-XPosed-4.1-A16-GeneralCompatFix.apk | grep "versionName='4.1'"
          unzip -t FontHub-XPosed-4.1-A16-GeneralCompatFix.apk
          sha256sum FontHub-XPosed-4.1-A16-GeneralCompatFix.apk > FontHub-XPosed-4.1-A16-GeneralCompatFix.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FontHub-XPosed-4.1-A16-GeneralCompatFix
          path: |
            FontHub-XPosed-4.1-A16-GeneralCompatFix.apk
            FontHub-XPosed-4.1-A16-GeneralCompatFix.apk.sha256
          if-no-files-found: error
