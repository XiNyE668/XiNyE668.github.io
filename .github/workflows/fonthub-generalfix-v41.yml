name: FontHub 4.2 General Compatibility Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fonthub-generalfix-v41/**'
      - '.github/workflows/fonthub-generalfix-v41.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Numbersf/MakeFontsGreatAgain.git upstream
          cat fonthub-generalfix-v41/parts/overlay.* | base64 -d > /tmp/overlay.zip
          echo 'e0d9dda944467304fe58ec75f0fa99dfb270558b8c753601e7b077f48ffda0ec  /tmp/overlay.zip' | sha256sum -c -
          unzip -t /tmp/overlay.zip
          unzip -qo /tmp/overlay.zip -d /tmp/overlay
          cp -a /tmp/overlay/app/. upstream/mfga-xposed/app/

          # The upstream manifest references @string/module_name.
          sed -i 's/name="app_name"/name="module_name"/' upstream/mfga-xposed/app/src/main/res/values/strings.xml

          # Fix the actual 4.1 routing bug: never cache packageName in a mutable module field.
          # libxposed PackageReadyParam already identifies the exact package for this callback.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/mfga-xposed/app/src/main/java/com/mfga/xposed/modern/ModernEntry.kt')
          s = p.read_text()
          s = s.replace('    private var packageName: String = ""\n\n', '')
          s = s.replace('        packageName = param.packageName\n        log(Log.INFO, TAG, "FontHub general+compat attach: ${param.packageName}")',
                        '        log(Log.INFO, TAG, "FontHub general+compat attach: ${param.packageName}")')
          s = s.replace('        val cl = param.classLoader\n        val special = FontCompatPolicy.isSpecial(packageName)',
                        '        val cl = param.classLoader\n        val packageName = param.packageName\n        val special = FontCompatPolicy.isSpecial(packageName)\n        log(Log.INFO, TAG, "FontHub compat ready: $packageName special=$special")')
          s = s.replace('        hookStaticFactory(cl, "createFromAsset", special)',
                        '        hookStaticFactory(cl, "createFromAsset", special, packageName)')
          s = s.replace('        hookStaticFactory(cl, "createFromFile", special)',
                        '        hookStaticFactory(cl, "createFromFile", special, packageName)')
          s = s.replace('        if (special) hookResourcesGetFont()',
                        '        if (special) hookResourcesGetFont(packageName)')
          s = s.replace('    private fun hookResourcesGetFont() {',
                        '    private fun hookResourcesGetFont(packageName: String) {')
          s = s.replace('    private fun hookStaticFactory(cl: ClassLoader, methodName: String, special: Boolean) {',
                        '    private fun hookStaticFactory(cl: ClassLoader, methodName: String, special: Boolean, packageName: String) {')
          p.write_text(s)
          PY

          # Requested standalone package id; behavior remains based on upstream MFGA.
          grep -RIlZ 'com\.mfga\.xposed' upstream/mfga-xposed/app | xargs -0 -r sed -i 's/com\.mfga\.xposed/billionaire.xinye.xposed/g'

          # Version bump.
          sed -i 's/versionCode = 41/versionCode = 42/' upstream/mfga-xposed/app/build.gradle.kts
          sed -i 's/versionName = "4.1"/versionName = "4.2"/' upstream/mfga-xposed/app/build.gradle.kts

          # Exact FontHub 1.3 icon composition.
          base64 -d fonthub-generalfix-v41/icon192.b64 > /tmp/fonthub192.png
          find upstream/mfga-xposed/app/src/main/res -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' \) -delete
          mkdir -p upstream/mfga-xposed/app/src/main/res/mipmap-xxxhdpi
          cp /tmp/fonthub192.png upstream/mfga-xposed/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp /tmp/fonthub192.png upstream/mfga-xposed/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          ! grep -RIl 'com\.mfga\.xposed' upstream/mfga-xposed/app
          grep -n 'applicationId = "billionaire.xinye.xposed"' upstream/mfga-xposed/app/build.gradle.kts
          grep -n 'versionCode = 42' upstream/mfga-xposed/app/build.gradle.kts
          grep -n 'versionName = "4.2"' upstream/mfga-xposed/app/build.gradle.kts
          grep -n 'val packageName = param.packageName' upstream/mfga-xposed/app/src/main/java/com/mfga/xposed/modern/ModernEntry.kt
          grep -n 'hookResourcesGetFont(packageName)' upstream/mfga-xposed/app/src/main/java/com/mfga/xposed/modern/ModernEntry.kt
          grep -n 'special, packageName' upstream/mfga-xposed/app/src/main/java/com/mfga/xposed/modern/ModernEntry.kt
          ! grep -n 'private var packageName' upstream/mfga-xposed/app/src/main/java/com/mfga/xposed/modern/ModernEntry.kt
          cat upstream/mfga-xposed/app/src/main/resources/META-INF/xposed/scope.list

      - name: Build release APK
        working-directory: upstream/mfga-xposed
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Align, sign and verify
        run: |
          set -euo pipefail
          UNSIGNED=$(find upstream/mfga-xposed/app/build/outputs/apk/release -name '*.apk' | head -1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$UNSIGNED" FontHub-4.2-aligned.apk
          curl -fsSL https://raw.githubusercontent.com/mfonville/pa_gapps/master/testkey.pk8 -o testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/mfonville/pa_gapps/master/testkey.x509.pem -o testkey.x509.pem
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --key testkey.pk8 --cert testkey.x509.pem \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out FontHub-XPosed-4.2-A16-GeneralCompatFix.apk FontHub-4.2-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs FontHub-XPosed-4.2-A16-GeneralCompatFix.apk
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging FontHub-XPosed-4.2-A16-GeneralCompatFix.apk | grep "package: name='billionaire.xinye.xposed'"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging FontHub-XPosed-4.2-A16-GeneralCompatFix.apk | grep "versionName='4.2'"
          unzip -t FontHub-XPosed-4.2-A16-GeneralCompatFix.apk
          sha256sum FontHub-XPosed-4.2-A16-GeneralCompatFix.apk > FontHub-XPosed-4.2-A16-GeneralCompatFix.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FontHub-XPosed-4.2-A16-GeneralCompatFix
          path: |
            FontHub-XPosed-4.2-A16-GeneralCompatFix.apk
            FontHub-XPosed-4.2-A16-GeneralCompatFix.apk.sha256
          if-no-files-found: error
