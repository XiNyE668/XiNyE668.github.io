name: lmipro V5 kernel build

on:
  push:
    branches:
      - build/lmipro-v5-20260827
    paths:
      - '.github/workflows/lmipro-v5.yml'
      - 'build/lmipro-v5/**'
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev dwarves \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git curl xz-utils patch

      - name: Fetch exact V4 Lineage kernel base
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin https://github.com/LineageOS/android_kernel_xiaomi_sm8250.git
          git fetch --depth=1 origin 71b13e62f057a649b77fe4062feb73ee72ad609c
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "71b13e62f057a649b77fe4062feb73ee72ad609c"
          git apply "$GITHUB_WORKSPACE/build/lmipro-v5/camera-v4.patch"
          grep -q 'default_compressor = "lzo"' drivers/block/zram/zram_drv.c
          sed -i 's/static const char \*default_compressor = "lzo";/static const char *default_compressor = "zstd";/' drivers/block/zram/zram_drv.c
          grep -n 'default_compressor' drivers/block/zram/zram_drv.c | head

      - name: Fetch exact official KernelSU Next legacy
        run: |
          set -euxo pipefail
          cd kernel
          git clone --filter=blob:none https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git fetch --depth=1 origin a54e4fa46c6cc25bcaa055cf14d790194beffed8
          git checkout --detach a54e4fa46c6cc25bcaa055cf14d790194beffed8
          test "$(git rev-parse HEAD)" = "a54e4fa46c6cc25bcaa055cf14d790194beffed8"
          cd ..
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Fetch exact official SUSFS 4.19 and probe patches
        run: |
          set -uxo pipefail
          cd kernel
          git clone --filter=blob:none --branch kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs-official
          cd susfs-official
          git fetch --depth=1 origin 001e69919c6271f690fd00b17e4c721c9e599152
          git checkout --detach 001e69919c6271f690fd00b17e4c721c9e599152
          echo "SUSFS_HEAD=$(git rev-parse HEAD)" | tee "$GITHUB_WORKSPACE/susfs-head.txt"
          cd ..

          cp susfs-official/kernel_patches/fs/* fs/
          cp susfs-official/kernel_patches/include/linux/* include/linux/

          set +e
          cd KernelSU-Next
          patch -p1 --dry-run < ../susfs-official/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch > "$GITHUB_WORKSPACE/ksu-susfs-dryrun.log" 2>&1
          echo $? > "$GITHUB_WORKSPACE/ksu-susfs-dryrun.status"
          cd ..
          patch -p1 --dry-run < susfs-official/kernel_patches/50_add_susfs_in_kernel-4.19.patch > "$GITHUB_WORKSPACE/kernel-susfs-dryrun.log" 2>&1
          echo $? > "$GITHUB_WORKSPACE/kernel-susfs-dryrun.status"
          set -e

          echo '=== KernelSU patch status ==='
          cat "$GITHUB_WORKSPACE/ksu-susfs-dryrun.status"
          cat "$GITHUB_WORKSPACE/ksu-susfs-dryrun.log"
          echo '=== kernel 4.19 patch status ==='
          cat "$GITHUB_WORKSPACE/kernel-susfs-dryrun.status"
          cat "$GITHUB_WORKSPACE/kernel-susfs-dryrun.log"

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmipro-v5-integration-probe
          path: |
            *dryrun*.log
            *dryrun*.status
            susfs-head.txt
          if-no-files-found: warn
