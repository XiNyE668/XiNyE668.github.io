name: KSU source bridge
on:
  push:
    branches: [ chatgpt-kernel-source-bridge ]
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned SUSFS 4.19 backport
        run: |
          git clone https://github.com/ShirkNeko/SUSFS4KSU.git susfs
          cd susfs
          git checkout 1f764cfb8ddc3b19d7624731051d1000d629175b
          cd ..
          tar --exclude='susfs/.git' -czf SUSFS4KSU-4.19-v1.5.9.tar.gz susfs/kernel_patches susfs/module.prop
      - name: Upload SUSFS source and patches
        uses: actions/upload-artifact@v4
        with:
          name: SUSFS4KSU-4.19-v1.5.9
          path: SUSFS4KSU-4.19-v1.5.9.tar.gz
          if-no-files-found: error
