name: KSU source bridge
on:
  push:
    branches: [ chatgpt-kernel-source-bridge ]
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned KernelSU Next legacy
        run: |
          git clone --filter=blob:none https://github.com/KernelSU-Next/KernelSU-Next.git ksu
          cd ksu
          git checkout a54e4fa46c6cc25bcaa055cf14d790194beffed8
          cd ..
          tar --exclude='ksu/.git' -czf KernelSU-Next-legacy-a54e4fa.tar.gz ksu/kernel ksu/uapi
      - name: Upload pinned source
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-legacy-a54e4fa
          path: KernelSU-Next-legacy-a54e4fa.tar.gz
          if-no-files-found: error
