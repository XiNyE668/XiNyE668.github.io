name: KSU source bridge
on:
  push:
    branches: [ chatgpt-kernel-source-bridge ]
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch SUSFS-ready KSU reference
        run: |
          git clone https://github.com/DXRN-MoonWake/KernelSU-Next.git ksu-ref
          cd ksu-ref
          git checkout 7200f73a7b4d0777217ead34fe9322978840df88
          cd ..
          tar --exclude='ksu-ref/.git' -czf KSU-SUSFS-ref-7200f73.tar.gz ksu-ref/kernel
      - name: Upload KSU reference
        uses: actions/upload-artifact@v4
        with:
          name: KSU-SUSFS-ref-7200f73
          path: KSU-SUSFS-ref-7200f73.tar.gz
          if-no-files-found: error
